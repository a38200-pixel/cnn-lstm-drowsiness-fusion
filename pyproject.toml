[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-lstm-drowsiness-fusion"
version = "0.1.0"
description = "SUST-DDD CNN-LSTM baseline reconstruction and behavior fusion research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "opencv-python>=4.9,<5.0",
  "PyYAML>=6.0,<7.0",
  "mlflow>=3.0,<4.0",
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
